<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Vaibhav Gangani animated flame header</title>
  <desc id="desc">Animated GitHub profile header with flame and game HUD style.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070A"/>
      <stop offset="0.5" stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#160B05"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB020"/>
      <stop offset="0.5" stop-color="#FF4D00"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .flame { transform-origin: bottom; animation: flame 1.6s ease-in-out infinite alternate; }
      .flame2 { transform-origin: bottom; animation: flame 1.25s ease-in-out infinite alternate-reverse; }
      .dash { stroke-dasharray: 16 18; animation: dash 12s linear infinite; }
      .scan { animation: scan 5s linear infinite; }
      .blink { animation: blink 1s step-end infinite; }
      @keyframes flame {
        from { transform: translateY(0) scaleY(0.92) skewX(-1deg); opacity: 0.72; }
        to { transform: translateY(-8px) scaleY(1.08) skewX(2deg); opacity: 1; }
      }
      @keyframes dash { to { stroke-dashoffset: -260; } }
      @keyframes scan {
        0% { transform: translateX(-240px); opacity: 0; }
        20% { opacity: 0.22; }
        100% { transform: translateX(1200px); opacity: 0; }
      }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="357" rx="24.5" stroke="#2A3342" stroke-width="3"/>
  <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M100 0V360M200 0V360M300 0V360M400 0V360M500 0V360M600 0V360M700 0V360M800 0V360M900 0V360M1000 0V360M1100 0V360" stroke="#1F2937" stroke-width="1"/>
  <rect x="-220" y="0" width="170" height="360" fill="url(#fire)" opacity="0.24" class="scan"/>

  <path d="M90 292C190 260 244 308 342 268C446 226 514 260 606 214C720 158 820 192 930 116C1000 68 1060 78 1120 52" stroke="url(#fire)" stroke-width="3" stroke-linecap="round" class="dash" filter="url(#glow)"/>

  <g transform="translate(74 78)">
    <text x="0" y="26" class="mono" font-size="17" fill="#FFB020">player: vaibhav0xq</text>
    <text x="0" y="98" class="sans" font-size="66" font-weight="900" fill="#F8FAFC">Vaibhav Gangani</text>
    <text x="4" y="142" class="sans" font-size="24" font-weight="700" fill="#CBD5E1">Web3 apps · Games · Tools · Experiments</text>
    <text x="4" y="202" class="mono" font-size="19" fill="#FFB020">build the idea, test the path, ship the lesson<span class="blink">_</span></text>
  </g>

  <g transform="translate(860 82)" filter="url(#glow)">
    <path class="flame" d="M92 176C38 150 62 86 94 44C96 78 126 92 130 128C152 108 160 82 152 54C210 104 224 166 178 204C150 228 110 216 92 176Z" fill="#FF7A18"/>
    <path class="flame2" d="M124 188C90 166 102 124 126 92C130 120 150 134 150 158C166 146 172 128 168 108C202 146 198 194 160 214C144 222 134 210 124 188Z" fill="#FFB020"/>
    <path class="flame" d="M134 196C116 180 122 152 140 132C144 150 158 160 156 178C168 170 172 158 172 146C194 178 178 218 146 222C142 214 140 204 134 196Z" fill="#F8FAFC" opacity="0.88"/>
  </g>
</svg>
