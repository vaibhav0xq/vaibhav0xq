<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(604 142) rotate(90) scale(106 260)">
      <stop stop-color="#F97316" stop-opacity=".34"/>
      <stop offset=".48" stop-color="#F59E0B" stop-opacity=".1"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="352" y1="142" x2="846" y2="142" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset=".46" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono{font-family:JetBrains Mono,Consolas,Menlo,monospace}
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}
      .orbit{stroke-dasharray:28 18;animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}
      .node{animation:node 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .card{animation:card 4.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .bar{animation:bar 3.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
      .flame{animation:flame 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
      .scan{animation:scan 4.8s ease-in-out infinite}
      @keyframes spin{to{stroke-dashoffset:-184;transform:rotate(360deg)}}
      @keyframes node{0%,100%{opacity:.42;transform:scale(.86)}50%{opacity:1;transform:scale(1.16)}}
      @keyframes card{0%,100%{transform:translateY(0);opacity:.82}50%{transform:translateY(-7px);opacity:1}}
      @keyframes bar{0%,100%{transform:scaleY(.36);opacity:.55}50%{transform:scaleY(1);opacity:1}}
      @keyframes flame{0%,100%{transform:skewX(0deg) scaleY(1);opacity:.92}36%{transform:skewX(-4deg) scaleY(1.08);opacity:1}72%{transform:skewX(3deg) scaleY(.96);opacity:.88}}
      @keyframes scan{0%{transform:translateX(-160px);opacity:0}18%,72%{opacity:.22}100%{transform:translateX(1140px);opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="280" rx="24" fill="#0D1117"/>
  <rect x="30" y="28" width="1140" height="224" rx="20" fill="#111827" stroke="#30363D"/>
  <rect x="30" y="28" width="1140" height="224" rx="20" fill="url(#coreGlow)"/>
  <rect class="scan" x="30" y="28" width="130" height="224" fill="#F59E0B"/>

  <text x="64" y="68" class="mono" font-size="16" font-weight="800" fill="#F59E0B">github motion</text>
  <text x="64" y="101" class="sans" font-size="24" font-weight="850" fill="#FFF1B8">GitHub activity in motion</text>
  <text x="64" y="130" class="sans" font-size="16" font-weight="700" fill="#94A3B8">stats, streaks, languages and contribution flow</text>

  <g transform="translate(78 166)" filter="url(#glow)">
    <rect class="bar" x="0" y="30" width="22" height="58" rx="7" fill="#38BDF8"/>
    <rect class="bar" x="40" y="8" width="22" height="80" rx="7" fill="#FBBF24" style="animation-delay:.25s"/>
    <rect class="bar" x="80" y="42" width="22" height="46" rx="7" fill="#F97316" style="animation-delay:.5s"/>
    <rect class="bar" x="120" y="18" width="22" height="70" rx="7" fill="#EF4444" style="animation-delay:.75s"/>
  </g>

  <g transform="translate(602 142)" filter="url(#glow)">
    <circle r="72" fill="#020617" stroke="#1E293B" stroke-width="8"/>
    <circle r="58" fill="#0B1220" stroke="#334155" stroke-width="2"/>
    <circle r="48" fill="#F97316" opacity=".18"/>
    <circle r="34" fill="#111827" opacity=".94"/>
    <path class="flame" d="M-42 24C-58 -4-44 -34-16 -42C-24 -20-14 -4 4 8C-16 8-30 14-42 24Z" fill="#F97316" opacity=".45" style="animation-delay:.1s"/>
    <path class="flame" d="M42 22C58 -4 48 -30 20 -40C28 -18 16 -2 -2 8C18 10 32 16 42 22Z" fill="#FBBF24" opacity=".34" style="animation-delay:.35s"/>
    <path d="M-38 48C-18 59 20 59 40 48" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <circle class="node" cx="-40" cy="36" r="4" fill="#F97316"/>
    <circle class="node" cx="42" cy="-36" r="4" fill="#FBBF24" style="animation-delay:.45s"/>
    <circle class="node" cx="48" cy="24" r="3.5" fill="#F97316" style="animation-delay:.9s"/>
    <path class="flame" d="M0 42C-21 31-26 9-12-12C-5-24-1-37-3-50C18-34 30-15 25 8C36-5 42-20 41-31C61-6 60 25 45 39C34 50 16 53 0 42Z" fill="#FF6A00"/>
    <path class="flame" d="M1 42C-11 32-12 15-4 2C3-8 7-20 6-30C21-17 28-1 22 15C33 8 36-3 38-12C48 10 41 33 1 42Z" fill="#FBBF24" style="animation-delay:.35s"/>
    <path class="flame" d="M2 42C-7 32-4 19 5 10C11 3 13-6 13-14C25 3 25 25 2 42Z" fill="#FFFFFF" style="animation-delay:.7s"/>
  </g>

  <g filter="url(#glow)">
    <circle class="node" cx="392" cy="140" r="7" fill="#38BDF8"/>
    <circle class="node" cx="604" cy="70" r="7" fill="#FBBF24" style="animation-delay:.45s"/>
    <circle class="node" cx="814" cy="140" r="7" fill="#F97316" style="animation-delay:.9s"/>
    <circle class="node" cx="604" cy="214" r="7" fill="#EF4444" style="animation-delay:1.35s"/>
  </g>

  <g class="mono" font-size="14" font-weight="800">
    <g transform="translate(900 58)">
      <g class="card">
        <rect width="188" height="44" rx="14" fill="#0B1220" stroke="#334155"/>
        <text x="22" y="28" fill="#FBBF24">stats</text>
        <text x="84" y="28" fill="#CBD5E1">clean</text>
      </g>
    </g>
    <g transform="translate(900 118)">
      <g class="card" style="animation-delay:.55s">
        <rect width="188" height="44" rx="14" fill="#0B1220" stroke="#334155"/>
        <text x="22" y="28" fill="#FBBF24">streak</text>
        <text x="96" y="28" fill="#CBD5E1">steady</text>
      </g>
    </g>
    <g transform="translate(900 178)">
      <g class="card" style="animation-delay:1.1s">
        <rect width="188" height="44" rx="14" fill="#0B1220" stroke="#334155"/>
        <text x="22" y="28" fill="#FBBF24">repos</text>
        <text x="86" y="28" fill="#CBD5E1">moving</text>
      </g>
    </g>
  </g>
</svg>
