<svg width="1200" height="46" viewBox="0 0 1200 46" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated flame divider">
  <defs>
    <linearGradient id="g" x1="0" y1="23" x2="1200" y2="23" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#FFB020"/>
      <stop offset="1" stop-color="#FF4D00"/>
    </linearGradient>
    <style>
      .dash { stroke-dasharray: 12 14; animation: dash 9s linear infinite; }
      .spark { animation: spark 2.2s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -240; } }
      @keyframes spark { 0%,100% { opacity: 0.25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-6px); } }
    </style>
  </defs>
  <path d="M30 23H1170" stroke="url(#g)" stroke-width="3" stroke-linecap="round" class="dash"/>
  <circle cx="190" cy="23" r="4" fill="#FFB020" class="spark"/>
  <circle cx="610" cy="23" r="4" fill="#38BDF8" class="spark"/>
  <circle cx="990" cy="23" r="4" fill="#FF4D00" class="spark"/>
</svg>
