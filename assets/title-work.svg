<svg width="1100" height="92" viewBox="0 0 1100 92" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title{font:800 34px system-ui,-apple-system,Segoe UI,sans-serif;fill:#F8FAFC}
    .tag{font:800 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#F59E0B}
    .map{stroke-dasharray:11 14;animation:sail 5.2s linear infinite}
    .coin{animation:rise 3s ease-in-out infinite}
    @keyframes sail{to{stroke-dashoffset:-125}}
    @keyframes rise{50%{transform:translateY(-6px);opacity:.6}}
  </style>
  <rect x="0" y="10" width="1100" height="70" rx="14" fill="#0D1117"/>
  <path class="map" d="M40 68C178 26 318 70 456 38S722 66 1058 26" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="32" y="55" class="title">Work</text>
  <text x="132" y="55" class="tag">projects and proof</text>
  <circle class="coin" cx="740" cy="33" r="4" fill="#FBBF24"/>
  <circle class="coin" cx="808" cy="62" r="3" fill="#F97316" style="animation-delay:.6s"/>
  <circle class="coin" cx="906" cy="38" r="3" fill="#38BDF8" style="animation-delay:1.2s"/>
</svg>
