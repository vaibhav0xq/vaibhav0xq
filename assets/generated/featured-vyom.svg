  <text x="24" y="66" class="muted">Time-locked digital capsules with Sui wallet reveal</text>
  <text x="24" y="84" class="muted">flows.</text>
  <circle cx="29" cy="119" r="5" fill="#3178c6"/>
  <text x="42" y="123" class="label">TypeScript</text>
  <text x="406" y="123" class="label" text-anchor="end">1 stars</text>
