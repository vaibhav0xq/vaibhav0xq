<svg width="430" height="145" viewBox="0 0 430 145" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .label{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#D6E4F0}
    .muted{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8BA3B5}
    .title{font:800 18px system-ui,-apple-system,Segoe UI,sans-serif;fill:#FBBF24}
    .num{font:900 28px system-ui,-apple-system,Segoe UI,sans-serif;fill:#58A6FF}
    .tiny{font:800 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#F59E0B}
  </style>
  <rect width="430" height="145" rx="14" fill="#0D1117"/>
  <rect x="1" y="1" width="428" height="143" rx="13" stroke="#243247"/>
  <rect x="0" y="0" width="430" height="145" rx="14" fill="url(#glow)" opacity=".55"/>
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(326.8 11.6) rotate(132) scale(344 130.5)">
      <stop stop-color="#F97316" stop-opacity=".26"/>
      <stop offset=".36" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="6" height="145" rx="3" fill="#F59E0B"/>
  <text x="24" y="34" class="title">Vyom</text>
