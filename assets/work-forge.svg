<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rail" x1="78" y1="270" x2="1122" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset=".38" stop-color="#FBBF24"/>
      <stop offset=".72" stop-color="#F97316"/>
      <stop offset="1" stop-color="#EF4444"/>
    </linearGradient>
    <radialGradient id="heat" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 182) rotate(90) scale(138 420)">
      <stop stop-color="#F97316" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#F59E0B" stop-opacity=".09"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono{font-family:JetBrains Mono,Consolas,Menlo,monospace}
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}
      .rail{stroke-dasharray:36 24;animation:rail 7s linear infinite}
      .card{animation:card 4.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .ember{animation:ember 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .flame{animation:flame 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
      .scan{animation:scan 5.2s ease-in-out infinite}
      @keyframes rail{to{stroke-dashoffset:-240}}
      @keyframes card{0%,100%{transform:translateY(0);opacity:.88}50%{transform:translateY(-8px);opacity:1}}
      @keyframes ember{0%,100%{opacity:.25;transform:translateY(10px) scale(.7)}50%{opacity:1;transform:translateY(-11px) scale(1.14)}}
      @keyframes flame{0%,100%{transform:skewX(0deg) scaleY(1);opacity:.9}38%{transform:skewX(-3deg) scaleY(1.08);opacity:1}72%{transform:skewX(3deg) scaleY(.94);opacity:.86}}
      @keyframes scan{0%{transform:translateX(-180px);opacity:0}18%,72%{opacity:.18}100%{transform:translateX(1180px);opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="360" rx="26" fill="#0D1117"/>
  <rect x="30" y="28" width="1140" height="302" rx="22" fill="#111827" stroke="#30363D"/>
  <rect x="30" y="28" width="1140" height="302" rx="22" fill="url(#heat)"/>
  <rect class="scan" x="30" y="28" width="140" height="302" fill="#F59E0B"/>

  <text x="64" y="70" class="mono" font-size="16" font-weight="800" fill="#F59E0B">selected work</text>
  <text x="64" y="104" class="sans" font-size="28" font-weight="850" fill="#FFF1B8">Projects forged from product problems</text>
  <text x="64" y="136" class="sans" font-size="17" font-weight="700" fill="#94A3B8">identity, proof pages and wallet-native experiments</text>

  <path class="rail" d="M78 270H1122" stroke="url(#rail)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

  <g transform="translate(88 174)">
    <g class="card">
      <rect width="300" height="76" rx="16" fill="#0B1220" stroke="#334155"/>
      <text x="24" y="31" class="mono" font-size="15" font-weight="900" fill="#F59E0B">Arc Identity</text>
      <text x="24" y="55" class="sans" font-size="16" font-weight="750" fill="#E5E7EB">identity and reputation layer</text>
    </g>
  </g>

  <g transform="translate(450 174)">
    <g class="card" style="animation-delay:.45s">
      <rect width="300" height="76" rx="16" fill="#0B1220" stroke="#334155"/>
      <text x="24" y="31" class="mono" font-size="15" font-weight="900" fill="#F59E0B">Vyom</text>
      <text x="24" y="55" class="sans" font-size="16" font-weight="750" fill="#E5E7EB">time-locked capsule flows</text>
    </g>
  </g>

  <g transform="translate(812 174)">
    <g class="card" style="animation-delay:.9s">
      <rect width="300" height="76" rx="16" fill="#0B1220" stroke="#334155"/>
      <text x="24" y="31" class="mono" font-size="15" font-weight="900" fill="#F59E0B">Receipts Network</text>
      <text x="24" y="55" class="sans" font-size="16" font-weight="750" fill="#E5E7EB">public proof and context pages</text>
    </g>
  </g>

  <g filter="url(#glow)">
    <circle class="ember" cx="238" cy="270" r="6" fill="#38BDF8"/>
    <circle class="ember" cx="600" cy="270" r="6" fill="#FBBF24" style="animation-delay:.55s"/>
    <circle class="ember" cx="962" cy="270" r="6" fill="#F97316" style="animation-delay:1.1s"/>
  </g>

  <g transform="translate(1010 64)" filter="url(#glow)">
    <circle cx="54" cy="54" r="48" fill="#0B1220" stroke="#334155" stroke-width="3"/>
    <circle cx="54" cy="54" r="31" stroke="#F59E0B" stroke-width="3" opacity=".7"/>
    <path class="rail" d="M54 12V28M54 80V96M12 54H28M80 54H96" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <path d="M66 30L57 62L35 76L44 44L66 30Z" fill="#F97316"/>
    <path d="M57 62L44 44" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
    <circle class="ember" cx="54" cy="54" r="5" fill="#FBBF24"/>
  </g>
</svg>
