    <style>.m{font-family:JetBrains Mono,Consolas,monospace}.s{font-family:Inter,Segoe UI,Arial,sans-serif}.rail{stroke-dasharray:32 22;animation:rail 7s linear infinite}.card{animation:card 4.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ember{animation:ember 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.flame{animation:flame 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}@keyframes rail{to{stroke-dashoffset:-216}}@keyframes card{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes ember{0%,100%{opacity:.25;transform:translateY(8px)}50%{opacity:1;transform:translateY(-8px)}}@keyframes flame{0%,100%{transform:skewX(0) scaleY(1);opacity:.9}40%{transform:skewX(-3deg) scaleY(1.08);opacity:1}72%{transform:skewX(3deg) scaleY(.95);opacity:.86}}</style>
