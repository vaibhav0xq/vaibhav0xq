<svg width="1200" height="270" viewBox="0 0 1200 270" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="edge" x1="48" y1="135" x2="1152" y2="135" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset=".42" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono{font-family:JetBrains Mono,Consolas,Menlo,monospace}
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}
      .ring{stroke-dasharray:30 18;animation:ring 6.5s linear infinite}
      .card{animation:card 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .flame{animation:flame 2.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
      @keyframes ring{to{stroke-dashoffset:-192}}
      @keyframes card{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      @keyframes flame{0%,100%{transform:skewX(0deg) scaleY(1);opacity:.92}40%{transform:skewX(-3deg) scaleY(1.08);opacity:1}70%{transform:skewX(3deg) scaleY(.94);opacity:.88}}
    </style>
  </defs>
  <rect width="1200" height="270" rx="24" fill="#0D1117"/>
  <rect x="30" y="28" width="1140" height="214" rx="20" fill="#111827" stroke="#30363D"/>
  <path class="ring" d="M76 214H1124" stroke="url(#edge)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

  <text x="68" y="70" class="mono" font-size="16" font-weight="800" fill="#F59E0B">build style</text>
  <text x="68" y="102" class="sans" font-size="25" font-weight="850" fill="#F8FAFC">Small releases, clear systems, honest iteration</text>

  <g transform="translate(74 132)">
    <g class="card">
      <rect width="208" height="58" rx="14" fill="#0B1220" stroke="#334155"/>
      <text x="22" y="26" class="mono" font-size="14" font-weight="800" fill="#F59E0B">Map</text>
      <text x="22" y="45" class="sans" font-size="15" font-weight="700" fill="#CBD5E1">find the real flow</text>
    </g>
  </g>
  <g transform="translate(326 132)">
    <g class="card" style="animation-delay:.35s">
      <rect width="208" height="58" rx="14" fill="#0B1220" stroke="#334155"/>
      <text x="22" y="26" class="mono" font-size="14" font-weight="800" fill="#F59E0B">Build</text>
      <text x="22" y="45" class="sans" font-size="15" font-weight="700" fill="#CBD5E1">ship a working path</text>
    </g>
  </g>
  <g transform="translate(578 132)">
    <g class="card" style="animation-delay:.7s">
      <rect width="208" height="58" rx="14" fill="#0B1220" stroke="#334155"/>
      <text x="22" y="26" class="mono" font-size="14" font-weight="800" fill="#F59E0B">Test</text>
      <text x="22" y="45" class="sans" font-size="15" font-weight="700" fill="#CBD5E1">use it like a user</text>
    </g>
  </g>
  <g transform="translate(830 132)">
    <g class="card" style="animation-delay:1.05s">
      <rect width="250" height="58" rx="14" fill="#0B1220" stroke="#334155"/>
      <text x="22" y="26" class="mono" font-size="14" font-weight="800" fill="#F59E0B">Improve</text>
      <text x="22" y="45" class="sans" font-size="15" font-weight="700" fill="#CBD5E1">turn feedback into polish</text>
    </g>
  </g>

  <g transform="translate(1060 55)" filter="url(#glow)">
    <path class="flame" d="M35 78C12 65 6 43 18 24C25 13 30 4 29 -10C47 4 58 22 55 40C67 28 70 13 70 3C89 23 91 53 78 68C69 78 55 83 35 78Z" fill="#FF6A00"/>
    <path class="flame" d="M36 78C22 66 21 50 30 37C36 29 40 18 39 9C53 22 60 36 55 50C66 43 70 33 72 24C82 43 76 66 36 78Z" fill="#FBBF24" style="animation-delay:.3s"/>
    <path class="flame" d="M38 78C28 67 30 55 38 47C44 40 47 33 47 25C58 39 61 55 38 78Z" fill="#FFFFFF" style="animation-delay:.6s"/>
  </g>
</svg>
