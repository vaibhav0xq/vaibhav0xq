<svg width="1100" height="178" viewBox="0 0 1100 178" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .label{font:800 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#F59E0B}
    .title{font:900 30px system-ui,-apple-system,Segoe UI,sans-serif;fill:#F8FAFC}
    .copy{font:700 16px system-ui,-apple-system,Segoe UI,sans-serif;fill:#BFDBFE}
    .chip{font:800 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#E5E7EB}
    .route{stroke-dasharray:12 15;animation:route 5s linear infinite}
    .ship{animation:sail 5s ease-in-out infinite}
    .needle{transform-origin:886px 83px;animation:needle 3.2s ease-in-out infinite}
    .star{animation:twinkle 2.6s ease-in-out infinite}
    .waveA{animation:wave 4.5s ease-in-out infinite}
    .waveB{animation:wave 5.5s ease-in-out infinite reverse}
    @keyframes route{to{stroke-dashoffset:-135}}
    @keyframes sail{50%{transform:translate(20px,-8px) rotate(-2deg)}}
    @keyframes needle{50%{transform:rotate(18deg)}}
    @keyframes twinkle{50%{opacity:.35;transform:scale(.75)}}
    @keyframes wave{50%{transform:translateX(-28px)}}
  </style>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0E7490"/>
      <stop offset=".48" stop-color="#155E75"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="1084" height="162" rx="20" fill="#0B1220" stroke="#243244"/>
  <rect x="32" y="30" width="1036" height="106" rx="16" fill="#111827" stroke="#334155"/>
  <path d="M32 116C142 96 236 124 350 106C470 87 560 124 674 102C810 75 924 111 1068 83V136H32Z" fill="url(#sea)" opacity=".72"/>
  <path class="waveA" d="M38 119C146 98 230 126 350 109C472 90 566 122 682 105C810 86 928 111 1064 88" stroke="#67E8F9" stroke-width="3" opacity=".7"/>
  <path class="waveB" d="M52 132C170 116 254 139 378 124C496 110 574 139 704 120C840 100 936 132 1068 106" stroke="#38BDF8" stroke-width="2" opacity=".45"/>
  <path class="route" d="M376 58C478 12 584 35 690 54C808 75 896 48 1030 24" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <path class="route" d="M376 72C492 32 594 52 706 66C818 80 908 60 1030 36" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity=".65"/>
  <g class="ship" transform="translate(640 78)" filter="url(#glow)">
    <path d="M-38 15H45L31 32H-27Z" fill="#3B2416"/>
    <path d="M-30 17C-12 28 18 29 37 17" fill="#7C4A22"/>
    <path d="M-8 12V-40" stroke="#E5E7EB" stroke-width="3" stroke-linecap="round"/>
    <path d="M-10 -37L-36 -4L-10 8Z" fill="#F8FAFC"/>
    <path d="M-3 -36C20 -26 28 -5 -3 9Z" fill="#FDE68A"/>
    <path d="M-8 -42L25 -35V-20L-8 -27Z" fill="#020617" stroke="#475569" stroke-width="1.5"/>
    <circle cx="-20" cy="21" r="2.3" fill="#FBBF24"/>
    <circle cx="2" cy="23" r="2.3" fill="#FBBF24"/>
    <path d="M-43 34C-20 43 22 43 48 34" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(886 83)">
    <circle r="39" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <circle r="26" fill="#111827" stroke="#1E293B"/>
    <path class="needle" d="M0 -31L9 2L0 31L-9 2Z" fill="#F59E0B"/>
    <circle r="5" fill="#E5E7EB"/>
  </g>
  <text x="64" y="64" class="label">next route</text>
  <text x="64" y="96" class="title">Exploring next</text>
  <text x="64" y="122" class="copy">game systems, packages, docs and new chains</text>
  <g>
    <rect x="64" y="140" width="120" height="22" rx="11" fill="#0F172A" stroke="#334155"/>
    <text x="86" y="155" class="chip">game dev</text>
    <rect x="198" y="140" width="120" height="22" rx="11" fill="#0F172A" stroke="#334155"/>
    <text x="224" y="155" class="chip">packages</text>
    <rect x="332" y="140" width="120" height="22" rx="11" fill="#0F172A" stroke="#334155"/>
    <text x="365" y="155" class="chip">docs</text>
    <rect x="466" y="140" width="120" height="22" rx="11" fill="#0F172A" stroke="#334155"/>
    <text x="492" y="155" class="chip">new chains</text>
  </g>
  <circle class="star" cx="746" cy="34" r="4" fill="#FBBF24"/>
  <circle class="star" cx="804" cy="70" r="3" fill="#38BDF8" style="animation-delay:.6s"/>
  <circle class="star" cx="1018" cy="64" r="3" fill="#F97316" style="animation-delay:1.1s"/>
</svg>
