<svg width="1100" height="260" viewBox="0 0 1100 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .eyebrow{font:800 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#F59E0B}
    .title{font:900 34px system-ui,-apple-system,Segoe UI,sans-serif;fill:#F8FAFC}
    .copy{font:700 16px system-ui,-apple-system,Segoe UI,sans-serif;fill:#BFDBFE}
    .cardTitle{font:800 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#FBBF24}
    .cardCopy{font:700 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#E5E7EB}
    .route{stroke-dasharray:13 16;animation:route 5s linear infinite}
    .ship{animation:sail 5s ease-in-out infinite}
    .needle{transform-origin:930px 82px;animation:needle 3.5s ease-in-out infinite}
    .dot{animation:blink 2.6s ease-in-out infinite}
    .waveA{animation:wave 4.8s ease-in-out infinite}
    .waveB{animation:wave 6s ease-in-out infinite reverse}
    @keyframes route{to{stroke-dashoffset:-145}}
    @keyframes sail{50%{transform:translate(24px,-7px) rotate(-2deg)}}
    @keyframes needle{50%{transform:rotate(18deg)}}
    @keyframes blink{50%{opacity:.35;transform:scale(.75)}}
    @keyframes wave{50%{transform:translateX(-30px)}}
  </style>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0E7490"/>
      <stop offset=".55" stop-color="#155E75"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="1084" height="244" rx="22" fill="#0B1220" stroke="#243244"/>
  <rect x="34" y="30" width="1032" height="126" rx="18" fill="#111827" stroke="#334155"/>
  <path d="M34 126C150 104 258 136 386 113C508 91 604 132 728 107C864 80 954 112 1066 88V156H34Z" fill="url(#sea)" opacity=".72"/>
  <path class="waveA" d="M42 128C158 108 252 136 386 116C510 98 612 129 728 112C846 94 944 116 1058 94" stroke="#67E8F9" stroke-width="3" opacity=".75"/>
  <path class="waveB" d="M48 145C170 126 264 148 400 132C520 118 620 146 742 128C868 108 946 136 1066 116" stroke="#38BDF8" stroke-width="2" opacity=".45"/>
  <path class="route" d="M408 68C512 18 606 40 720 59C832 77 912 54 1040 30" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <path class="route" d="M408 83C520 42 620 58 734 72C842 84 922 68 1040 44" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity=".65"/>

  <text x="68" y="64" class="eyebrow">next route</text>
  <text x="68" y="101" class="title">Exploring next</text>
  <text x="68" y="128" class="copy">game systems, packages, docs and new chain experiments</text>

  <g class="ship" transform="translate(670 84)" filter="url(#glow)">
    <path d="M-42 17H48L34 35H-30Z" fill="#3B2416"/>
    <path d="M-34 19C-14 31 20 32 40 19" fill="#7C4A22"/>
    <path d="M-8 14V-44" stroke="#E5E7EB" stroke-width="3" stroke-linecap="round"/>
    <path d="M-10 -40L-38 -4L-10 10Z" fill="#F8FAFC"/>
    <path d="M-3 -39C23 -28 30 -5 -3 11Z" fill="#FDE68A"/>
    <path d="M-8 -46L28 -39V-22L-8 -30Z" fill="#020617" stroke="#475569" stroke-width="1.5"/>
    <circle cx="-22" cy="24" r="2.4" fill="#FBBF24"/>
    <circle cx="2" cy="26" r="2.4" fill="#FBBF24"/>
    <path d="M-48 38C-20 48 24 48 52 38" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(930 82)">
    <circle r="42" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <circle r="27" fill="#111827" stroke="#1E293B"/>
    <path class="needle" d="M0 -32L9 2L0 32L-9 2Z" fill="#F59E0B"/>
    <circle r="5" fill="#E5E7EB"/>
  </g>

  <g transform="translate(56 178)">
    <rect width="238" height="50" rx="13" fill="#0F172A" stroke="#334155"/>
    <text x="18" y="22" class="cardTitle">Game systems</text>
    <text x="18" y="40" class="cardCopy">interactive mechanics and loops</text>
  </g>
  <g transform="translate(312 178)">
    <rect width="238" height="50" rx="13" fill="#0F172A" stroke="#334155"/>
    <text x="18" y="22" class="cardTitle">Packages</text>
    <text x="18" y="40" class="cardCopy">small reusable developer tools</text>
  </g>
  <g transform="translate(568 178)">
    <rect width="238" height="50" rx="13" fill="#0F172A" stroke="#334155"/>
    <text x="18" y="22" class="cardTitle">Docs and demos</text>
    <text x="18" y="40" class="cardCopy">clearer handoff for builders</text>
  </g>
  <g transform="translate(824 178)">
    <rect width="220" height="50" rx="13" fill="#0F172A" stroke="#334155"/>
    <text x="18" y="22" class="cardTitle">New chains</text>
    <text x="18" y="40" class="cardCopy">wallet flows and proof layers</text>
  </g>

  <circle class="dot" cx="770" cy="36" r="4" fill="#FBBF24"/>
  <circle class="dot" cx="836" cy="78" r="3" fill="#38BDF8" style="animation-delay:.6s"/>
  <circle class="dot" cx="1015" cy="64" r="3" fill="#F97316" style="animation-delay:1.1s"/>
</svg>
