<svg width="1200" height="190" viewBox="0 0 1200 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="track" x1="112" y1="96" x2="1088" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset=".42" stop-color="#67E8F9"/>
      <stop offset=".74" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="sea" x1="56" y1="136" x2="1144" y2="136" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9" stop-opacity=".34"/>
      <stop offset=".48" stop-color="#22D3EE" stop-opacity=".1"/>
      <stop offset="1" stop-color="#F97316" stop-opacity=".18"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:800}
      .mono{font-family:JetBrains Mono,Consolas,Menlo,monospace}
      .track{stroke-dasharray:34 20;animation:track 6.5s linear infinite}
      .wake{stroke-dasharray:9 18;animation:wave 8s linear infinite reverse}
      .runner{animation:runner 7s ease-in-out infinite;offset-path:path("M 112 96 C 250 42, 382 138, 520 96 S 792 50, 936 96 S 1050 144, 1088 96");}
      .wave{stroke-dasharray:38 22;animation:wave 8s linear infinite}
      .pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .chip{animation:chip 6s ease-in-out infinite}
      .sail{animation:sail 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes track{to{stroke-dashoffset:-176}}
      @keyframes wave{to{stroke-dashoffset:-240}}
      @keyframes runner{0%{offset-distance:0%}100%{offset-distance:100%}}
      @keyframes pulse{0%,100%{opacity:.64;transform:scale(.96)}50%{opacity:1;transform:scale(1.08)}}
      @keyframes chip{0%,100%{opacity:.62}15%,28%{opacity:1}}
      @keyframes sail{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-2px)}}
    </style>
  </defs>
  <rect width="1200" height="190" rx="22" fill="#0D1117"/>
  <rect x="24" y="20" width="1152" height="150" rx="18" fill="#111827" stroke="#30363D"/>
