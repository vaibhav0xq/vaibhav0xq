  <text x="60" y="58" class="mono" font-size="16" font-weight="800" fill="#F59E0B">current loop</text>
  <path class="track" d="M112 96C250 42 382 138 520 96S792 50 936 96S1050 144 1088 96" stroke="url(#track)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <path class="wake" d="M112 104C250 50 382 146 520 104S792 58 936 104S1050 152 1088 104" stroke="#E0F2FE" stroke-width="2" stroke-linecap="round" opacity=".65"/>
