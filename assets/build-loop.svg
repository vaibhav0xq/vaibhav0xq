<svg width="1200" height="230" viewBox="0 0 1200 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated build loop</title>
  <desc id="desc">Animated build process loop.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .dash { stroke-dasharray: 16 18; animation: dash 10s linear infinite; }
      .float { animation: float 5s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -260; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    </style>
  </defs>
  <rect width="1200" height="230" rx="24" fill="#0B0F14"/>
  <rect x="1.5" y="1.5" width="1197" height="227" rx="22.5" stroke="#2A3342" stroke-width="3"/>
  <path d="M160 134H1040" stroke="#FFB020" stroke-width="3" stroke-linecap="round" class="dash"/>
  <g transform="translate(100 76)" class="float">
    <rect width="150" height="96" rx="18" fill="#111827" stroke="#38BDF8" stroke-width="3"/>
    <text x="75" y="44" text-anchor="middle" class="sans" font-size="21" font-weight="900" fill="#F8FAFC">Map</text>
    <text x="75" y="68" text-anchor="middle" class="mono" font-size="12" fill="#CBD5E1">flow first</text>
  </g>
  <g transform="translate(350 76)" class="float" style="animation-delay:-1s">
    <rect width="150" height="96" rx="18" fill="#111827" stroke="#FFB020" stroke-width="3"/>
    <text x="75" y="44" text-anchor="middle" class="sans" font-size="21" font-weight="900" fill="#F8FAFC">Build</text>
    <text x="75" y="68" text-anchor="middle" class="mono" font-size="12" fill="#CBD5E1">working slice</text>
  </g>
  <g transform="translate(600 76)" class="float" style="animation-delay:-2s">
    <rect width="150" height="96" rx="18" fill="#111827" stroke="#A78BFA" stroke-width="3"/>
    <text x="75" y="44" text-anchor="middle" class="sans" font-size="21" font-weight="900" fill="#F8FAFC">Test</text>
    <text x="75" y="68" text-anchor="middle" class="mono" font-size="12" fill="#CBD5E1">real path</text>
  </g>
  <g transform="translate(850 76)" class="float" style="animation-delay:-3s">
    <rect width="150" height="96" rx="18" fill="#111827" stroke="#FF7A18" stroke-width="3"/>
    <text x="75" y="44" text-anchor="middle" class="sans" font-size="21" font-weight="900" fill="#F8FAFC">Ship</text>
    <text x="75" y="68" text-anchor="middle" class="mono" font-size="12" fill="#CBD5E1">then refine</text>
  </g>
</svg>
