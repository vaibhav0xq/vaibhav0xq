<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated quest board</title>
  <desc id="desc">Animated status bars for current focus areas.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .a { animation: a 5s ease-in-out infinite; }
      .b { animation: b 5.7s ease-in-out infinite; }
      .c { animation: c 6.2s ease-in-out infinite; }
      .d { animation: d 6.8s ease-in-out infinite; }
      @keyframes a { 0%,100% { width: 430px; } 50% { width: 590px; } }
      @keyframes b { 0%,100% { width: 350px; } 50% { width: 510px; } }
      @keyframes c { 0%,100% { width: 500px; } 50% { width: 390px; } }
      @keyframes d { 0%,100% { width: 280px; } 50% { width: 470px; } }
    </style>
  </defs>
  <rect width="1200" height="260" rx="24" fill="#0B0F14"/>
  <rect x="1.5" y="1.5" width="1197" height="257" rx="22.5" stroke="#2A3342" stroke-width="3"/>
  <text x="64" y="58" class="mono" font-size="16" fill="#FFB020">quest board</text>
  <text x="64" y="98" class="sans" font-size="34" font-weight="900" fill="#F8FAFC">Current focus, not final form.</text>
  <g transform="translate(72 132)">
    <text x="0" y="17" class="mono" font-size="15" fill="#CBD5E1">web3 systems</text>
    <rect x="180" y="0" width="660" height="22" rx="11" fill="#1F2937"/>
    <rect x="180" y="0" height="22" rx="11" fill="#38BDF8" class="a"/>
    <text x="0" y="55" class="mono" font-size="15" fill="#CBD5E1">game dev</text>
    <rect x="180" y="38" width="660" height="22" rx="11" fill="#1F2937"/>
    <rect x="180" y="38" height="22" rx="11" fill="#FFB020" class="b"/>
    <text x="0" y="93" class="mono" font-size="15" fill="#CBD5E1">tools / packages</text>
    <rect x="180" y="76" width="660" height="22" rx="11" fill="#1F2937"/>
    <rect x="180" y="76" height="22" rx="11" fill="#A78BFA" class="c"/>
    <text x="0" y="131" class="mono" font-size="15" fill="#CBD5E1">testing / docs</text>
    <rect x="180" y="114" width="660" height="22" rx="11" fill="#1F2937"/>
    <rect x="180" y="114" height="22" rx="11" fill="#FF7A18" class="d"/>
  </g>
</svg>
