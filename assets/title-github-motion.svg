<svg width="1100" height="92" viewBox="0 0 1100 92" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title{font:800 34px system-ui,-apple-system,Segoe UI,sans-serif;fill:#F8FAFC}
    .tag{font:800 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#F59E0B}
    .wave{stroke-dasharray:10 13;animation:flow 4.5s linear infinite}
    .bar{animation:bars 1.8s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-120}}
    @keyframes bars{50%{transform:scaleY(.55)}}
  </style>
  <rect x="0" y="10" width="1100" height="70" rx="14" fill="#0D1117"/>
  <path class="wave" d="M430 58C520 76 594 34 690 48S828 70 1056 44" stroke="#38BDF8" stroke-width="2.5"/>
  <path class="wave" d="M430 68C530 80 608 48 704 58S848 78 1056 52" stroke="#F59E0B" stroke-width="2" opacity=".75"/>
  <text x="32" y="55" class="title">GitHub Motion</text>
  <text x="290" y="55" class="tag">live profile signals</text>
  <rect class="bar" x="930" y="44" width="10" height="22" rx="4" fill="#38BDF8" style="transform-origin:935px 66px"/>
  <rect class="bar" x="950" y="34" width="10" height="32" rx="4" fill="#FBBF24" style="transform-origin:955px 66px;animation-delay:.2s"/>
  <rect class="bar" x="970" y="50" width="10" height="16" rx="4" fill="#F97316" style="transform-origin:975px 66px;animation-delay:.4s"/>
</svg>
