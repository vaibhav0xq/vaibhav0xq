<svg width="1100" height="92" viewBox="0 0 1100 92" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title{font:800 34px system-ui,-apple-system,Segoe UI,sans-serif;fill:#F8FAFC}
    .tag{font:800 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#F59E0B}
    .road{stroke-dasharray:14 16;animation:road 5s linear infinite}
    .mark{animation:mark 2.5s ease-in-out infinite}
    @keyframes road{to{stroke-dashoffset:-130}}
    @keyframes mark{50%{transform:translateX(12px);opacity:.7}}
  </style>
  <rect x="0" y="10" width="1100" height="70" rx="14" fill="#0D1117"/>
  <path class="road" d="M390 36H610C700 36 704 66 792 66H1058" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="32" y="55" class="title">Build Style</text>
  <text x="232" y="55" class="tag">how I move ideas</text>
  <path class="mark" d="M914 47L928 61L958 31" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
