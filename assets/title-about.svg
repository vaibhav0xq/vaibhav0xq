<svg width="1100" height="92" viewBox="0 0 1100 92" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title{font:800 34px system-ui,-apple-system,Segoe UI,sans-serif;fill:#F8FAFC}
    .tag{font:800 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#F59E0B}
    .line{stroke-dasharray:10 16;animation:dash 5s linear infinite}
    .spark{animation:float 2.8s ease-in-out infinite}
    @keyframes dash{to{stroke-dashoffset:-120}}
    @keyframes float{50%{transform:translateY(-5px);opacity:1}}
  </style>
  <rect x="0" y="10" width="1100" height="70" rx="14" fill="#0D1117"/>
  <path class="line" d="M300 64C430 44 530 68 654 48S860 30 1056 54" stroke="#F59E0B" stroke-width="2" opacity=".8"/>
  <text x="32" y="55" class="title">About</text>
  <text x="160" y="55" class="tag">who I am building as</text>
  <circle class="spark" cx="704" cy="34" r="4" fill="#FBBF24"/>
  <circle class="spark" cx="780" cy="62" r="3" fill="#F97316" style="animation-delay:.5s"/>
  <circle class="spark" cx="860" cy="42" r="2.5" fill="#38BDF8" style="animation-delay:1s"/>
</svg>
